<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>약속캐치 접근성 서비스 확인 영상</title>
  <style>
    body {
      margin: 0;
      padding: 32px 18px;
      background: #f3f8f7;
      color: #163235;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #d6e3e3;
      border-radius: 22px;
      background: #fff;
    }
    h1 { margin-top: 0; font-size: 26px; }
    p { color: #4f6769; line-height: 1.6; }
    video { width: 100%; max-height: 78vh; background: #000; border-radius: 14px; }
    a { color: #0b5f63; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>약속캐치 접근성 서비스 확인 영상</h1>
    <p>Google Play 검토를 위한 접근성 서비스 사용 및 동작 확인 영상입니다.</p>
    <video controls preload="metadata">
      <source src="accessibility-demo.mp4" type="video/mp4">
      브라우저가 MP4 영상 재생을 지원하지 않습니다.
    </video>
    <p><a href="accessibility-demo.mp4">영상 파일 직접 열기</a></p>
  </main>
</body>
</html>
